name: Build iOS sideload (unsigned)

# 只跑未签名 iOS IPA 的手动构建；与 build-win-ios-manual 分开，便于单独
# 重试 macOS runner 排队。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS IPA
    uses: ./.github/workflows/build-ios.yml
    with:
      upload-to-app-store: false
    secrets: inherit
