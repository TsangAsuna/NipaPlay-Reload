name: Mobile Recovery Test Build

# Erika 前后台播放自愈修复的移动端测试包构建。
# 基于 build-android.yml / build-ios.yml 的步骤裁剪：
#   - 手动触发（workflow_dispatch），不走发布链路
#   - 无签名 secrets：Android 使用 debug keystore 签名（composite 内置回退），
#     iOS 输出未签名 IPA（侧载需自行签名，如 AltStore/Sideloadly/TrollStore）
#   - Erika 内核使用预编译产物（ERIKA_PREBUILT=1），无需 Rust 源码构建

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FVP_DEPS_URL: https://github.com/wang-bin/mdk-sdk/releases/latest/download/
      FVP_DEPS_LATEST: 1
      ERIKA_PREBUILT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          submodules: recursive

      - name: Free workspace disk (pre-cache)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Disk usage before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          echo "=== Disk usage after cleanup ==="
          df -h

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-v2-

      - name: Setup Flutter Environment
        id: setup
        uses: ./.github/actions/setup-flutter
        with:
          java-version: '17'

      - name: Generate build info json
        shell: bash
        run: python3 .github/workflows/scripts/generate-build-info-json.py assets/build_info.json

      - name: Pre-download Gradle Wrapper
        if: hashFiles('android/gradlew') != ''
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --version || true
        continue-on-error: true

      - name: Build Android APK
        uses: ./.github/actions/build-android
        with:
          app-version: ${{ steps.setup.outputs.version }}
          # 留空签名输入 → composite 回退到 debug keystore，产出可直接安装的 APK
          signing-key: ''
          keystore-password: ''
          key-alias: ''
          key-password: ''

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recovery-test-Android
          path: build/app/outputs/apk/release/NipaPlay-*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-26
    timeout-minutes: 150
    env:
      FVP_DEPS_URL: https://github.com/wang-bin/mdk-sdk/releases/latest/download/
      FVP_DEPS_LATEST: 1
      ERIKA_PREBUILT: "1"
    steps:
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          submodules: recursive

      - name: Cache iOS Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ios-pods-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: |
            ios-pods-

      - name: Setup Flutter Environment
        id: setup
        uses: ./.github/actions/setup-flutter

      - name: Generate build info json
        shell: bash
        run: python3 .github/workflows/scripts/generate-build-info-json.py assets/build_info.json

      - name: Build unsigned iOS IPA
        id: unsigned_build
        uses: ./.github/actions/build-ios
        with:
          app-version: ${{ steps.setup.outputs.version }}

      - name: Upload unsigned iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recovery-test-iOS
          path: ${{ steps.unsigned_build.outputs.ipa-path }}
          if-no-files-found: error

      - name: Upload Dart debug symbols (for de-obfuscating crash stacks)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dart-symbols-iOS-recovery-test
          path: build/symbols-ios/
          if-no-files-found: warn
