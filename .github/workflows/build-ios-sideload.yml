name: Build iOS sideload (unsigned)

# 只跑未签名 iOS IPA 的手动构建；macos 池子间歇故障期间单独重试，
# 不重复消耗 Windows runner 时长。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS IPA
    uses: ./.github/workflows/build-ios.yml
    with:
      upload-to-app-store: false
    secrets: inherit
