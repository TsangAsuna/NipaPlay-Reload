name: Build iOS sideload (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS IPA (Erika first-frame from source)
    uses: ./.github/workflows/build-ios.yml
    with:
      upload-to-app-store: false
      erika-force-source-build: true
    secrets: inherit
