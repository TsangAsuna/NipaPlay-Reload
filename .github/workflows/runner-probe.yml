name: Runner Probe

# 诊断用：验证 macOS runner 标签当前是否有容量。跑完可删。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos26:
    name: Probe macos-26
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - run: sw_vers && xcodebuild -version

  macos15:
    name: Probe macos-15
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - run: sw_vers && xcodebuild -version
